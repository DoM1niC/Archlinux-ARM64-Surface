# Die Videoknoten des Qualcomm-Kamera-Subsystems (CAMSS) liefern nur Rohdaten
# und ergeben keine brauchbare Kamera. Programme sollen die Kamera über
# libcamera nutzen, deshalb die direkten V4L2-Geräte von CAMSS ausblenden.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-.*isp.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
