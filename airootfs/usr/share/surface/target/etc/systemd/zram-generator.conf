# Komprimierter Auslagerungsspeicher im RAM (zram). Ohne Swap wird das System
# bei Speichermangel erst zäh und friert dann ein, bevor der OOM-Killer
# eingreift; zram fängt Spitzen ab, systemd-oomd beendet bei anhaltendem
# Druck das verursachende Programm (surface-install).
# Compressed swap in RAM; together with systemd-oomd it keeps the system from
# freezing when memory runs out.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
