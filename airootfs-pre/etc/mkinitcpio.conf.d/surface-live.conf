# Initramfs des Live-Systems (archiso-Hooks, kein autodetect)
MODULES=(virtio_blk virtio_scsi virtio_pci usb_storage uas)
# Kein "kms": Der Grafiktreiber (msm) kommt über surface-qcom, die übrigen
# DRM-Treiber (amdgpu, nouveau, ...) wären hier nur Ballast.
HOOKS=(base udev modconf archiso archiso_loop_mnt surface_isoscan block filesystems keyboard surface-qcom)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-15 -T0)
