# Unterstützte Geräte. Eine Zeile pro Gerät, Felder durch "|" getrennt:
#
# Kernel-Parameter, die alle Geräte bekommen (zusätzlich zur Spalte unten):
#   clk_ignore_unused pd_ignore_unused   Takte/Power-Domains der Firmware nicht abschalten
#   systemd.tpm2_wait=0                  die Firmware meldet ein TPM, für das es keinen
#                                        Treiber gibt – systemd wartet sonst 90 s darauf
#   cpufreq.default_governor=schedutil   Takt nach Last; der Kernel stellt sonst
#                                        "performance" ein (dauernd Höchsttakt)
#
#   id | Anzeigename | Devicetree (relativ zu dtb/qcom/) | zusätzliche Kernel-Parameter
#      | DT-compatible (zur Erkennung im laufenden System)
#      | SMBIOS-Produktname (Regex, für GRUB) | SMBIOS-SKU (Regex, optional)
#
# Die Devicetrees stammen aus dem linux-surface-Kernel. Die SMBIOS-Erkennung im
# Bootmenü ist nur eine Vorauswahl nach bestem Wissen – im Zweifel das Gerät im
# Menü von Hand wählen. Ist die SKU-Spalte leer, gilt der Eintrag für alle SKUs.
#
