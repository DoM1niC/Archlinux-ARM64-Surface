# Devicetree-Zusätze (Overlays) und Zusatzmodule je Gerät:
#
#   id | Overlays (Namen unter airootfs/usr/share/surface/overlays) | kmods (yes/leer)
#
# Die Overlays werden beim ISO-Bau auf den Devicetree des Kernelpakets
# angewendet (Live-System) und vom Installer für das installierte System
# eingetragen (/etc/default/surface-boot, surface-dtb-update). "kmods" heißt:
# Das Gerät braucht die Zusatzmodule aus surface-kmods.
#
# Surface Laptop 7: Touchpad und Touchscreen (HID über QSPI) sowie die
# Frontkamera (CAMSS, OV02C10). Auf dem 13,8" getestet; das 15" hat laut
# ACPI-Tabellen und den Patches anderer Projekte dieselbe Verdrahtung.
sl7-13|sl7-touchpad sl7-touchscreen sl7-camera|yes
sl7-15|sl7-touchpad sl7-touchscreen sl7-camera|yes
